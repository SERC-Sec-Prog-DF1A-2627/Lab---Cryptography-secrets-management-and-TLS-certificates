<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College Secure Notes</title>
  <style>
    body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 1.1rem/1.5 system-ui, sans-serif; color: #152d39; }
    h1 { margin-bottom: .4rem; } h2 { font-size: 1.25rem; } label { display: block; margin: .7rem 0; }
    textarea { display: block; width: 95%; min-height: 5rem; } input, select, textarea, button { font: inherit; }
    button { margin: .4rem 0; padding: .35rem .8rem; } li { margin: .4rem 0; overflow-wrap: anywhere; }
    .error { color: #8b1a1a; }
  </style>
</head>
<body><main><h1>College Secure Notes</h1>{% block content %}{% endblock %}</main></body>
</html>
